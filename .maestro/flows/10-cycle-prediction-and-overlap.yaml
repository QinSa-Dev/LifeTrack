# 写入路径 10：周期预测窗口（可调）+ 边界重叠预演。
#
# 这是「周期增强收尾」这一项的端到端回归（docs/learning/11-cycle-tracking.md 的 4.11 / 4.12 节）：
#   1. 预测窗口是**全局偏好**，开关在「设置 → 偏好设置」里（最近 1 / 3 / 5 段），点一下就把
#      偏好写进 app_meta（app.prediction_window）；周期定义页的预测文案随之变成
#      「按最近 N 段间隔的平均 X 天」；
#   2. 改一段周期的边界、让它压到同一周期里的另一段时，保存**之前**就提示
#      「会和已有的一段周期重叠」（真正的拒绝仍在保存时，由仓储执行）。
#
# 自建一个专用定义「Maestro预测」，不碰使用者的数据，也不动 05 / 07 / 08 用的「Maestro周期」。
# 幂等：定义与三段周期只在第一次跑时创建（已存在就跳过创建）；后面的断言两种情况下都成立。
# 副作用：定义「Maestro预测」+ 三段周期（没有每日记录），收尾 SQL 见 .maestro/README.md。
#
# 前提：运行日期晚于 2026-08-05（写这段时是 2026-10-23），三段周期才都能按先后顺序建出来。
appId: host.exp.Exponent
name: 10 周期 · 预测窗口可调 + 重叠预演
tags:
  - write
---
- launchApp:
    stopApp: true
- openLink: exp://127.0.0.1:8081
- extendedWaitUntil:
    visible: '时间轴, tab, 1 of 5'
    timeout: 120000

# —— 定义「Maestro预测」：只在不存在时新建（不填平均周期长度，逼预测用观察到的间隔）——
- tapOn: '.*周期, tab.*'
- assertVisible: '+ 新建周期定义'
- runFlow:
    when:
      notVisible: '.*Maestro预测.*'
    commands:
      - tapOn: '+ 新建周期定义'
      - assertVisible: '例如：生理期'
      - tapOn: '例如：生理期'
      - inputText: 'Maestro预测'
      - pressKey: Enter
      - scrollUntilVisible:
          element:
            text: '创建'
          direction: DOWN
      - tapOn: '创建'
      - assertVisible: '.*Maestro预测.*'
- scrollUntilVisible:
    element:
      text: '.*Maestro预测.*'
    direction: DOWN
- tapOn: '.*Maestro预测.*'
- assertVisible: '定义信息'

# —— 三段周期：只在还没有「进行中」的一段时创建（A / B 已结束，C 进行中）——
- scrollUntilVisible:
    element:
      text: '周期记录'
    direction: DOWN
- runFlow:
    when:
      notVisible: '.*~ 进行中.*'
    commands:
      # A：2026-08-01 ~ 2026-08-05
      - tapOn: '2026-10-19'
      - eraseText: 12
      - inputText: '2026-08-01'
      - pressKey: Enter
      - tapOn: '开始新周期'
      - assertVisible: '周期区间'
      - scrollUntilVisible:
          element:
            text: '结束日期（留空表示进行中）'
          direction: UP
      - tapOn: '2026-10-05'
      - eraseText: 12
      - inputText: '2026-08-05'
      - pressKey: Enter
      - tapOn: '保存边界'
      - scrollUntilVisible:
          element:
            text: '.*边界已更新：2026-08-01 ~ 2026-08-05.*'
          direction: UP
      - scrollUntilVisible:
          element:
            text: '返回'
          direction: UP
      - tapOn: '返回'
      # B：2026-09-01 ~ 2026-09-05
      - tapOn: '2026-10-19'
      - eraseText: 12
      - inputText: '2026-09-01'
      - pressKey: Enter
      - tapOn: '开始新周期'
      - assertVisible: '周期区间'
      - scrollUntilVisible:
          element:
            text: '结束日期（留空表示进行中）'
          direction: UP
      - tapOn: '2026-10-05'
      - eraseText: 12
      - inputText: '2026-09-05'
      - pressKey: Enter
      - tapOn: '保存边界'
      - scrollUntilVisible:
          element:
            text: '.*边界已更新：2026-09-01 ~ 2026-09-05.*'
          direction: UP
      - scrollUntilVisible:
          element:
            text: '返回'
          direction: UP
      - tapOn: '返回'
      # C：2026-10-01 起，进行中
      - tapOn: '2026-10-19'
      - eraseText: 12
      - inputText: '2026-10-01'
      - pressKey: Enter
      - tapOn: '开始新周期'
      - assertVisible: '周期区间'
      - scrollUntilVisible:
          element:
            text: '返回'
          direction: UP
      - tapOn: '返回'
- assertVisible: '定义信息'

# —— 默认窗口 3 段（间隔 31 / 30 天 → 平均四舍五入 31 天）——
- scrollUntilVisible:
    element:
      text: '.*预测下次开始日.*'
    direction: UP
- assertVisible: '.*按最近 2 段间隔的平均 31 天.*'
- takeScreenshot: 10-prediction-window-3

# —— 到「设置 → 偏好设置」把窗口切成「最近 1 段」——
# 定义页是压栈路由，底部没有标签栏，先返回「周期」标签页
- scrollUntilVisible:
    element:
      text: '返回'
    direction: UP
- tapOn: '返回'
- tapOn: '.*设置, tab.*'
- scrollUntilVisible:
    element:
      text: '偏好设置'
    direction: DOWN
- tapOn: '最近 1 段'
- takeScreenshot: 10-settings-window-1
# 回定义页：预测文案应变成「按最近 1 段间隔的平均 30 天」
- tapOn: '.*周期, tab.*'
- scrollUntilVisible:
    element:
      text: '.*Maestro预测.*'
    direction: DOWN
- tapOn: '.*Maestro预测.*'
- scrollUntilVisible:
    element:
      text: '.*预测下次开始日.*'
    direction: UP
- assertVisible: '.*按最近 1 段间隔的平均 30 天.*'
- takeScreenshot: 10-prediction-window-1

# —— 切回默认 3 段，不影响下次 ——
- scrollUntilVisible:
    element:
      text: '返回'
    direction: UP
- tapOn: '返回'
- tapOn: '.*设置, tab.*'
- scrollUntilVisible:
    element:
      text: '偏好设置'
    direction: DOWN
- tapOn: '最近 3 段'
- tapOn: '.*周期, tab.*'
- scrollUntilVisible:
    element:
      text: '.*Maestro预测.*'
    direction: DOWN
- tapOn: '.*Maestro预测.*'

# —— 重叠预演：把进行中的 C 的开始日改到 2026-09-03，压到 B 上 ——
- scrollUntilVisible:
    element:
      text: '.*2026-10-01 ~ 进行中.*'
    direction: DOWN
- tapOn: '.*2026-10-01 ~ 进行中.*'
- assertVisible: '周期区间'
- scrollUntilVisible:
    element:
      text: '开始日期'
    direction: UP
- tapOn: '2026-10-01'
- eraseText: 12
- inputText: '2026-09-03'
- pressKey: Enter
- assertVisible: '.*会和已有的一段周期重叠（2026-09-01 ~ 2026-09-05）.*'
- takeScreenshot: 10-overlap-preview
