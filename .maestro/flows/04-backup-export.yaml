# 写入路径 4：设置页「导出 JSON 备份」→ 系统分享面板出现 → 取消。
#
# 覆盖：备份仓储真的写出了文件（否则 Sharing 不会弹面板），并且面板能正常关闭。
# 不覆盖：真的存到「文件」App（那要走出 App，动系统的文件选择器，先不碰）。
#
# 只断言面板出现 + 取消，不改本地数据。
appId: host.exp.Exponent
name: 04 设置 · 导出 JSON 备份 → 系统分享面板
tags:
  - export
---
- launchApp:
    stopApp: true
- openLink: exp://127.0.0.1:8081
- extendedWaitUntil:
    visible: '时间轴, tab, 1 of 4'
    timeout: 120000
- tapOn: '.*设置, tab.*'
- assertVisible: '偏好设置'
- takeScreenshot: 04-settings
# 「偏好设置」这张卡在「备份与恢复」上面，导出按钮可能已经在屏幕外了 —— 先滚到它。
# 用 centerElement 把它停到屏幕中间：停在屏幕底部的话会压在标签栏下面，点下去会被标签栏截走
# （踩过一次：按钮看着可见，实则被「统计」标签接走了点击）。
- scrollUntilVisible:
    element:
      text: '导出 JSON 备份'
    direction: DOWN
    centerElement: true
- tapOn: '导出 JSON 备份'
# iOS 26 的分享面板里那颗按钮叫「保存到“文件”」（带弯引号），不是「存储到文件」
- extendedWaitUntil:
    visible: '.*保存到.*文件.*'
    timeout: 60000
- takeScreenshot: 04-share-sheet
# 关掉分享面板：面板自带「dismiss popup」按钮，兜底再下滑一次
- tapOn:
    text: 'dismiss popup'
    optional: true
- swipe:
    direction: DOWN
- assertVisible: '导出 JSON 备份'
- takeScreenshot: 04-back-to-settings
